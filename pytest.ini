[pytest]
# 项目根目录加入 sys.path，这样 tests/ 里可以直接 import config / src.*
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
